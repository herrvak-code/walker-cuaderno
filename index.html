<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cuaderno · Walker</title>
<!--
  Página de entrada de la biblioteca privada de Jose. Todo el contenido está
  cifrado (PBKDF2 + AES-GCM, WebCrypto); sin la contraseña solo se descarga
  ruido. Lo genera publicar_web.py. Creado el 05/11/2026 por Claude Code.
-->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3eedf; color: #303b35; font: 16px/1.5 'Iowan Old Style', Palatino, Georgia, serif; }
  form { background: #fffcf3; border: 1px solid #d7d0bc; border-radius: 4px; padding: 32px 36px; width: min(360px, 86vw); box-shadow: 0 2px 10px #5243290b; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 0 0 20px; color: #686c5f; font-size: 14px; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 10px 12px; font: 16px ui-monospace, Menlo, monospace; border: 1px solid #d7d0bc; border-radius: 3px; background: #fff; }
  button { margin-top: 14px; width: 100%; padding: 10px; font: 600 15px Arial, sans-serif; color: #fff; background: #366650; border: 0; border-radius: 3px; cursor: pointer; }
  label { display: flex; gap: 8px; align-items: center; margin-top: 12px; font: 13px Arial, sans-serif; color: #686c5f; }
  #estado { min-height: 20px; margin-top: 12px; font: 13px Arial, sans-serif; color: #984d3f; }
</style>
</head>
<body>
<form id="entrada" autocomplete="off">
  <h1>Cuaderno</h1>
  <p>Biblioteca privada de opiniones externas.</p>
  <input id="clave" type="password" placeholder="Contraseña" aria-label="Contraseña" autofocus>
  <label><input id="recordar" type="checkbox" checked> Recordar en este dispositivo</label>
  <button type="submit">Entrar</button>
  <div id="estado" role="status"></div>
</form>
<script>
const ALMACEN = 'walker-cuaderno-llave';
const estado = t => { document.getElementById('estado').textContent = t; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function llaveDe(clave) {
  const cfg = await (await fetch('clave.json', { cache: 'no-store' })).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(cfg.sal), iterations: cfg.iteraciones, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
// 06/11/2026: la edición viaja comprimida (gzip) antes de cifrar, de 17 MB a unos 4, y se guarda
// cifrada en la caché del navegador; solo se vuelve a bajar cuando version.json trae otra huella.
const CACHE = 'walker-cuaderno-datos';
const mb = n => (n / 1048576).toFixed(1).replace('.', ',');
class ErrorClave extends Error {}
async function version() {
  try { return await (await fetch('version.json', { cache: 'no-store' })).json(); } catch (e) { return {}; }
}
async function descargar(v) {
  const url = 'c/biblioteca.bin?v=' + String(v.sha256_cifrado || Date.now()).slice(0, 16);
  let cache = null;
  try { cache = await caches.open(CACHE); } catch (e) {}
  if (cache) {
    const guardado = await cache.match(url);
    if (guardado) { estado('Abriendo la copia guardada…'); return new Uint8Array(await guardado.arrayBuffer()); }
  }
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('sin datos');
  const total = v.bytes_cifrado || Number(r.headers.get('content-length')) || 0;
  const trozos = []; let n = 0;
  const lector = r.body.getReader();
  for (;;) {
    const { done, value } = await lector.read();
    if (done) break;
    trozos.push(value); n += value.length;
    estado(total ? `Descargando ${mb(n)} de ${mb(total)} MB…` : `Descargando ${mb(n)} MB…`);
  }
  const b = new Uint8Array(n); let p = 0;
  for (const t of trozos) { b.set(t, p); p += t.length; }
  if (cache) {
    try {
      for (const k of await cache.keys()) await cache.delete(k);
      await cache.put(url, new Response(b));
    } catch (e) {}
  }
  return b;
}
async function abrir(llave) {
  estado('Comprobando la edición…');
  const v = await version();
  if (v.formato === 'gzip' && typeof DecompressionStream === 'undefined')
    throw new Error('Este navegador no puede abrir la biblioteca. Actualízalo (en iPhone, iOS 16.4 o posterior).');
  const b = await descargar(v);
  estado('Descifrando…');
  let claro;
  try { claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, llave, b.slice(12)); }
  catch (e) { throw new ErrorClave(); }
  if (v.formato === 'gzip') {
    estado('Descomprimiendo…');
    claro = await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
  estado('Abriendo…');
  await new Promise(r => setTimeout(r, 30));
  const html = new TextDecoder().decode(claro);
  document.open(); document.write(html); document.close();
}
document.getElementById('entrada').addEventListener('submit', async ev => {
  ev.preventDefault();
  estado('Comprobando…');
  try {
    const llave = await llaveDe(document.getElementById('clave').value);
    await abrir(llave);
    if (document.getElementById('recordar')?.checked !== false) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', llave));
      try { localStorage.setItem(ALMACEN, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
  } catch (e) { estado(e instanceof ErrorClave ? 'Contraseña incorrecta.' : (e.message === 'sin datos' || e instanceof TypeError ? 'No se ha podido descargar. Revisa la conexión y vuelve a intentarlo.' : e.message)); }
});
(async () => {
  if (new URLSearchParams(location.search).has('salir')) {
    try { localStorage.removeItem(ALMACEN); } catch (e) {}
    try { await caches.delete(CACHE); } catch (e) {}
    estado('Sesión y copia guardada olvidadas en este dispositivo.'); return;
  }
  let guardada = null;
  try { guardada = localStorage.getItem(ALMACEN); } catch (e) {}
  if (!guardada) return;
  try { await abrir(await crypto.subtle.importKey('raw', b64(guardada), { name: 'AES-GCM' }, true, ['decrypt'])); }
  catch (e) {
    if (e instanceof ErrorClave) { try { localStorage.removeItem(ALMACEN); } catch (_) {} estado(''); }
    else estado(e.message === 'sin datos' || e instanceof TypeError ? 'No se ha podido descargar. Revisa la conexión y recarga.' : e.message);
  }
})();
</script>
</body>
</html>
